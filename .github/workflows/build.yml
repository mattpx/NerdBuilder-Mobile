name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK + CMake
        run: sdkmanager "ndk;27.0.11718014" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 || sudo apt-get install -y gradle && gradle wrapper --gradle-version 8.7
          fi
        working-directory: .

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11718014

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nerdbuilder-debug
          path: app/build/outputs/apk/debug/*.apk
